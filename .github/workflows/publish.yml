name: Publish to NuGet

# vX.Y.Z 태그 push 또는 수동 실행 시 NuGet 으로 배포합니다.
# NuGet Trusted Publishing(OIDC) 사용 — 장기 API 키 불필요.
# 사전 조건:
#   1. nuget.org → 계정 메뉴 → Trusted Publishing → 정책 추가
#      Repository Owner: send-go / Repository: aspnetcore / Workflow File: publish.yml
#   2. repo 시크릿 NUGET_USER = nuget.org 사용자명(프로필 이름, 이메일 아님)
#   3. 코어 Sendgo.SDK 가 먼저 게시돼 있어야 의존성이 해결됩니다.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC (Trusted Publishing)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: 패키지 pack
        run: dotnet pack src -c Release -o out
      # 임시 API 키는 1시간만 유효하므로 push 직전에 발급받습니다.
      - name: NuGet 로그인 (OIDC → 단기 API 키)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: NuGet 배포
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
